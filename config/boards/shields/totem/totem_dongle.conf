CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SLEEP=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_STUDIO=y

# --- Totem status (menu bar app on macOS) ---
# Fetch battery levels of both halves on the dongle
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Raw HID interface for the host app (zzeneg/zmk-raw-hid)
CONFIG_RAW_HID=y
CONFIG_USB_HID_DEVICE_COUNT=2
# Our module (modules/totem_status): Win/Mac mode + battery reporting
CONFIG_TOTEM_STATUS=y
CONFIG_TOTEM_STATUS_WIN_LAYER=1
# Start in macOS mode; switch to Windows if the macOS app doesn't show up within 8 s
CONFIG_TOTEM_STATUS_WIN_FALLBACK_MS=8000
# Link RSSI of the halves, shown in the app (HCI Read RSSI needs this in the controller)
CONFIG_BT_CTLR_CONN_RSSI=y

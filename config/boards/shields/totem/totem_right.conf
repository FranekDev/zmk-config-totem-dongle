# Battery voltage for the Totem Status app, read by the dongle (modules/totem_status)
CONFIG_TOTEM_BATTERY_VOLTAGE_SERVICE=y
# Battery % comes from the totem,battery-lipo sensor (state of charge channel)
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
# Fresh battery readings: burst after boot and after plugging/unplugging USB, every 30 s
# otherwise, also while the half is idle (modules/totem_status)
CONFIG_TOTEM_BATTERY_SAMPLER=y
